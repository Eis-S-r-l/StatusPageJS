services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eis_status
      POSTGRES_USER: eis_status
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eis_status -d eis_status"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: worker
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://eis_status:${POSTGRES_PASSWORD:-change-this-password}@database:5432/eis_status
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://eis_status:${POSTGRES_PASSWORD:-change-this-password}@database:5432/eis_status
    volumes:
      - branding_data:/app/data/branding
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://eis_status:${POSTGRES_PASSWORD:-change-this-password}@database:5432/eis_status
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STATUS_DOMAIN: ${STATUS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  branding_data:
