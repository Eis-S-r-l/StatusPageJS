services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eis_status
      POSTGRES_USER: eis_status
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eis_status -d eis_status"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/eis-s-r-l/statuspagejs-worker:${CONTAINER_IMAGE_TAG:-latest}
    build:
      context: .
      target: worker
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://eis_status:${POSTGRES_PASSWORD:-change-this-password}@database:5432/eis_status
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  web:
    image: ghcr.io/eis-s-r-l/statuspagejs-web:${CONTAINER_IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://eis_status:${POSTGRES_PASSWORD:-change-this-password}@database:5432/eis_status
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - branding_data:/app/data/branding
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/eis-s-r-l/statuspagejs-worker:${CONTAINER_IMAGE_TAG:-latest}
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://eis_status:${POSTGRES_PASSWORD:-change-this-password}@database:5432/eis_status
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/worker/healthcheck.ts"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  branding_data:
